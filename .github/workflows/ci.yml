name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run syntax check
        run: |
          python -m py_compile src/incident_analyzer/**/*.py scripts/*.py

      - name: Run import test
        run: |
          python -c "
          from incident_analyzer.config import get_settings
          from incident_analyzer.schemas import IncidentReport, LogEntry, LogChunk
          from incident_analyzer.ingestion.parser import parse_log_file, chunk_logs
          from incident_analyzer.retrieval import build_retriever, BM25Index
          from incident_analyzer.generation import IncidentAgent
          from incident_analyzer.evaluation import Evaluator
          from incident_analyzer.observability import setup_tracing
          print('All imports OK')
          "

      - name: Run evaluation (mock mode)
        run: |
          python scripts/eval.py tests/golden_set.jsonl
        env:
          ANTHROPIC_API_KEY: ""

      - name: Run ask CLI (mock mode)
        run: |
          python scripts/ask.py "Why did the payment service fail?"
        env:
          ANTHROPIC_API_KEY: ""

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: |
          docker compose config --quiet
        working-directory: .