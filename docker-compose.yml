version: "3.8"

services:
  # Vector database for semantic search (optional - can use BM25 only)
  qdrant:
    image: qdrant/qdrant:v1.11
    container_name: incident-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local embeddings via Ollama (nomic-embed-text, bge-m3, etc.)
  ollama:
    image: ollama/ollama:0.5
    container_name: incident-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Observability - Langfuse for tracing
  langfuse:
    image: langfuse/langfuse:3
    container_name: incident-langfuse
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@db:5432/langfuse
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-changeme}
      - SALT=${LANGFUSE_SALT:-changeme}
      - LANGFUSE_ENABLE_EXPERIMENTAL_OTEL=1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: incident-postgres
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Local LLM for generation (if you want fully offline)
  # ollama-llm:
  #   image: ollama/ollama:0.5
  #   container_name: incident-ollama-llm
  #   ports:
  #     - "11435:11434"
  #   volumes:
  #     - ollama_llm_data:/root/.ollama
  #   environment:
  #     - OLLAMA_KEEP_ALIVE=24h

volumes:
  qdrant_data:
  ollama_data:
  postgres_data:
  # ollama_llm_data: